name: Deploy

# Every push to main (your own commits and merged Weblate pull requests) goes live.
# Run it by hand from the Actions tab with "Run workflow".
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one instead of cancelling it
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to an exact commit (their version in the comment), since this job holds the Cloudflare token
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check that locales/en.json matches index.html
        run: |
          python3 tools/extract-en.py
          if ! git diff --quiet -- locales/en.json; then
            echo "::error::locales/en.json is out of date. Run 'python3 tools/extract-en.py' and commit it."
            git diff -- locales/en.json
            exit 1
          fi

      # Publishes the site's files and cloudflare/worker.js together (see cloudflare/wrangler.toml)
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          wranglerVersion: "4.157.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare

