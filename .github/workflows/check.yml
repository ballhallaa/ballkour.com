name: Check

# Every pull request, Weblate's too, gets the same checks as a deploy before it's merged: locales/en.json matches the
# pages, the scripts parse, and the translations keep their {placeholders} (see tools/check.py). Run it by hand from the
# Actions tab with "Run workflow".
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned to an exact commit (its version in the comment), like the deploy's
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check that locales/en.json matches index.html
        run: python3 tools/extract-en.py --check

      - name: Check the scripts, settings, and translations
        run: python3 tools/check.py
