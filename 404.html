<style>
:root {
  --void: #030605;
  --glass: rgba(9, 15, 13, 0.9);
  --line: rgba(196, 255, 232, 0.11);

  --volt: #00e697;
  --volt-hi: #4ff0b8;
  --on-volt: #001a10;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  display: grid;
  place-items: center;
  padding: 32px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px));
  background: var(--void);
  color: var(--ink);
  font: 400 16px/1.5 var(--body);
  text-align: center;
  -webkit-font-smoothing: antialiased;
}
#warp { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; z-index: 0; }
main { position: relative; z-index: 1; max-width: 520px; display: grid; justify-items: center; gap: 18px; }
#logo { width: 132px; height: 132px; filter: grayscale(.35); transform: rotate(-12deg); }
.code { font: 500 13px/1 var(--mono); letter-spacing: .14em; color: var(--ink-3); }
h1 {
  margin: 0;
  font: italic 800 clamp(48px, 13vw, 84px)/.85 var(--display);
  text-transform: uppercase;
  text-wrap: balance;
  text-shadow: .035em 0 0 rgba(255, 154, 46, .8), -.035em 0 0 rgba(51, 198, 255, .75);
}
p { margin: 0; color: var(--ink-2); text-wrap: balance; }
/* The same link rows as the main site's Source code panel */
.links {
  width: min(100%, 420px);
  margin-top: 8px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--glass);
  overflow: hidden;
  text-align: left;
}
.link-row { display: flex; align-items: center; gap: 14px; padding: 14px 18px; color: var(--ink); text-decoration: none; transition: background-color .15s; }
.link-row + .link-row { border-top: 1px solid var(--line); }
.link-row:hover { background: var(--wash); }
.link-row:focus-visible { outline-offset: -2px; }
.lr-icon { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: 10px; background: rgba(0, 230, 151, .12); color: var(--volt); }
.lr-icon svg { width: 18px; height: 18px; }
.lr-text { flex: 1; min-width: 0; }
.lr-title { display: block; font: 600 16.5px/1.25 var(--body); }
.lr-sub { display: block; margin-top: 3px; overflow-wrap: anywhere; font: 400 12.5px/1.4 var(--mono); color: var(--ink-2); }
.lr-arrow { width: 18px; height: 18px; flex: none; color: var(--ink-3); transition: transform .15s, color .15s; }
.link-row:hover .lr-arrow { color: var(--volt); transform: translate(2px, -2px); }
@media (prefers-reduced-motion: reduce) { .link-row, .lr-arrow { transition: none; } }
a:focus-visible { outline: 2px solid var(--volt); outline-offset: 3px; }
</style>
</head>
<body>
<canvas id="warp" aria-hidden="true"></canvas>
<main>
  <img id="logo" src="/assets/logo.webp" width="132" height="132" alt="">
  <span class="code">404</span>
  <h1 data-i18n="nf.title">Off the course</h1>
  <p data-i18n="nf.text">This page doesn’t exist. The link may have a typo, or the page may have moved.</p>
  <nav class="links" aria-label="Ballkour">

    <a class="link-row" href="/discord" target="_blank" rel="noopener">
      <span class="lr-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/></svg></span>

<script type="application/json" id="i18n-dynamic">
{
  "nf.doc": "Page not found"
}
</script>

<script>
(() => {
  "use strict";
  /* ---------- Language: the same choice as the main page ---------- */
  const LANGS = { en: "en", de: "de", es: "es", fr: "fr", it: "it", pl: "pl", pt: "pt-BR", tr: "tr", ru: "ru", th: "th", ja: "ja", ko: "ko", zh_cn: "zh-Hans", zh_tw: "zh-Hant" };
  function pickLang() {
    try { const saved = localStorage.getItem("ballkour-lang"); if (saved && LANGS[saved]) return saved; } catch (e) { /* private mode */ }
    for (const raw of navigator.languages || [navigator.language || "en"]) {
      const l = String(raw).toLowerCase();
      if (l.startsWith("zh")) return /(tw|hk|mo|hant)/.test(l) ? "zh_tw" : "zh_cn";
      const base = l.split("-")[0];
      if (LANGS[base]) return base;
    }
    return "en";
  }
  const lang = pickLang();
  if (lang !== "en") {
    fetch(`/locales/${lang}.json`)
      .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
      .then((dict) => {
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const v = dict[el.dataset.i18n];
          if (typeof v === "string" && v.trim()) el.textContent = v;
        });
        if (typeof dict["nf.doc"] === "string" && dict["nf.doc"].trim()) document.title = `${dict["nf.doc"]} · Ballkour`;
        document.documentElement.lang = LANGS[lang];
      })
      .catch(() => {});
  }

  /* ---------- Warp background, bursting from behind the logo ---------- */
  const canvas = document.getElementById("warp");
  const ctx = canvas.getContext("2d");
  const logo = document.getElementById("logo");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const PALETTE = [[0, 230, 151], [0, 230, 151], [0, 230, 151], [0, 230, 151], [110, 255, 205], [255, 154, 46], [51, 198, 255]];
  const rand = (a, b) => a + Math.random() * (b - a);
  let W = 0, H = 0, dpr = 1, maxD = 0, streaks = [], last = 0;
  function spawn(s, anywhere) {
    s.a = Math.random() * Math.PI * 2;
    s.d = anywhere ? rand(0, maxD) : rand(0, 50);
    s.v = rand(36, 120);
    s.w = rand(0.6, 2.1);
    s.l = rand(0.12, 0.3);
    s.c = PALETTE[(Math.random() * PALETTE.length) | 0];
    return s;
  }
  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    W = innerWidth; H = innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    maxD = Math.hypot(W, H) + 80;
    const n = Math.max(60, Math.min(200, Math.round((W * H) / 9000)));
    while (streaks.length < n) streaks.push(spawn({}, true));
    streaks.length = n;
  }
  function draw(dt) {
    const r = logo.getBoundingClientRect();
    const ox = r.left + r.width / 2, oy = r.top + r.height / 2;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "#030605";
    ctx.fillRect(0, 0, W, H);
    const glow = ctx.createRadialGradient(ox, oy, 0, ox, oy, Math.max(W, H) * 0.7);
    glow.addColorStop(0, "rgba(0,230,151,0.18)");
    glow.addColorStop(0.25, "rgba(0,150,100,0.06)");
    glow.addColorStop(1, "rgba(3,6,5,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";
    ctx.lineCap = "round";
    for (const s of streaks) {
      s.d += s.v * dt * (1 + s.d / 240);
      if (s.d > maxD) spawn(s, false);
      const len = Math.min(s.d, s.l * s.d + 4);
      const cx = Math.cos(s.a), cy = Math.sin(s.a);
      const alpha = Math.min(1, s.d / 260) * 0.6;
      ctx.lineWidth = s.w * (0.55 + s.d / 700);
      ctx.strokeStyle = `rgba(${s.c[0]},${s.c[1]},${s.c[2]},${alpha.toFixed(3)})`;
      ctx.beginPath();
      ctx.moveTo(ox + cx * (s.d - len), oy + cy * (s.d - len));
      ctx.lineTo(ox + cx * s.d, oy + cy * s.d);
      ctx.stroke();
    }
    ctx.globalCompositeOperation = "source-over";
    const vig = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.78);
    vig.addColorStop(0, "rgba(0,0,0,0)");
    vig.addColorStop(1, "rgba(0,0,0,0.55)");
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);
  }
  function loop(t) {
    if (document.hidden) { last = 0; requestAnimationFrame(loop); return; }
    const dt = last ? Math.min(0.05, (t - last) / 1000) : 1 / 60;
    last = t;
    draw(dt);
    requestAnimationFrame(loop);
  }
  addEventListener("resize", () => { size(); if (reduced) draw(0); });
  size();
  if (reduced) { draw(0); logo.addEventListener("load", () => draw(0)); } else requestAnimationFrame(loop);
})();
</script>
</body>
</html>
