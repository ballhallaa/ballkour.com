# Deploy from this folder with: npx wrangler deploy (GitHub Actions does this on every push to main)
name = "ballkour-discord-widget"
main = "worker.js"
compatibility_date = "2026-06-01"
workers_dev = false
routes = [{ pattern = "ballkour.com/*", zone_name = "ballkour.com" }]

# The site's files: the repo root, minus what's listed in /.assetsignore. Cloudflare serves them, so the
# site doesn't need the VPS. Every request still runs worker.js first, so pages get their data baked in.
[assets]
directory = ".."
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = true

# Who can approve or turn down top 10 runs sent from the website, at ballkour.com/submit: Discord IDs, separated
# by commas (in Discord: Developer Mode on, then right-click someone → Copy User ID). See worker.js.
[vars]
REVIEWERS = "175372497720573953, 206866465025032193"

# Runs sent from the website: at most 5 a minute from one Discord account (submit() in worker.js). The test copy below
# doesn't get it, since environments don't inherit bindings, and goes without the limit.
[[ratelimits]]
name = "SUBMIT_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Stats on players' Discord profiles (see "Stats on Discord profiles" in worker.js): the Discord tokens of everyone who
# turned them on, and what was last sent to their profile. Without it, the button for it doesn't show. Made once with
#   npx wrangler kv namespace create PROFILES
# which prints the id to put here.
[[kv_namespaces]]
binding = "PROFILES"
id = "ba04c07666a6439b91466ab161b84e00"

# Every 30 minutes, the stats on players' Discord profiles catch up with the boards
[triggers]
crons = ["*/30 * * * *"]

# A test copy on workers.dev, with no route: npx wrangler deploy --env test
[env.test]
workers_dev = true
routes = []

# The test copy has no PROFILES (environments don't inherit it), so it has nothing to update
[env.test.triggers]
crons = []

# The test copy saves runs sent from it to the game repo's test-runs branch, never develop, so the real boards
# aren't touched. Environments don't inherit [vars], so its reviewers are here too.
[env.test.vars]
REVIEWERS = "175372497720573953, 206866465025032193"
RUNS_BRANCH = "test-runs"
