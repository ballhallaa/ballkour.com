# Deploy from this folder with: npx wrangler deploy (GitHub Actions does this on every push to main)
name = "ballkour-discord-widget"
main = "worker.js"
compatibility_date = "2026-06-01"
workers_dev = false
routes = [{ pattern = "ballkour.com/*", zone_name = "ballkour.com" }]

# The site's files: the repo root, minus what's listed in /.assetsignore. Cloudflare serves them, so the
# site doesn't need the VPS. Every request runs worker.js first, so pages get their data baked in, except the fonts,
# pictures, and translations (assets/ and locales/): Cloudflare serves those straight away, with the headers in
# /_headers. That's most of a first visit's requests, and requests that don't run the Worker don't count toward the
# free plan's 100,000 a day.
[assets]
directory = ".."
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/*", "!/assets/*", "!/locales/*"]

# Who can approve or turn down top 10 runs sent from the website, at ballkour.com/submit: everyone on the server with a
# role in REVIEWER_ROLES. Role IDs, separated by commas (in Discord: Developer Mode on, then Server Settings → Roles →
# right-click a role → Copy Role ID). See worker.js.
#
# RUNS_CHANNEL is the run submissions channel: Ballkyrie posts every run sent from the website there, with a View run
# button to its page (ballkour.com/runs/<id>). Ballkyrie needs to be able to see it, send messages and embed links
# there. The test copy below leaves it out, so its runs aren't posted.
#
# CLAIMS_CHANNEL is where Ballkyrie posts every claim to legacy runs (runs from before May 2026, see "Claiming legacy
# runs" in worker.js) for moderators to check, with the same permissions there. The test copy leaves it out too.
#
# NOTIFY_PLAYERS = "on": Ballkyrie tells a player in a DM when a moderator checks their top 10 run or legacy claim (see
# tellPlayer() in worker.js). The test copy leaves it out, so it never messages anyone.
[vars]
REVIEWER_ROLES = "1497735437979226194" # mod
RUNS_CHANNEL = "1569040889756655658" # run-submissions
CLAIMS_CHANNEL = "1569164212901773453" # legacy claims
NOTIFY_PLAYERS = "on"

# Runs sent from the website: at most 5 a minute from one Discord account (submit() in worker.js), claims to legacy runs
# included (claim()). Changes to the name on a player's link have their own 5 a minute (setLink()). The test copy below
# doesn't get it, since environments don't inherit bindings, and goes without the limit.
[[ratelimits]]
name = "SUBMIT_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Stats on players' Discord profiles (see "Stats on Discord profiles" in worker.js): the Discord tokens of everyone who
# turned them on, and what was last sent to their profile. Without it, the button for it doesn't show. It also keeps
# what each run sent from the website did when it was sent (run:<id>, see "Each run's page"), which its page shows
# beside today's numbers; without it, the page has just today's. And a top 10 run's post in the run submissions channel
# (post:<id>), until a moderator checks the run and the post changes to say so; without it, the post stays yellow.
# Made once with
#   npx wrangler kv namespace create PROFILES
# which prints the id to put here.
[[kv_namespaces]]
binding = "PROFILES"
id = "ba04c07666a6439b91466ab161b84e00"

# Page views (see "Page views" in worker.js): how many times the site is opened in a browser, and by how many people,
# for the moderators' Page views at the bottom of the page. A Durable Object, a small SQLite database the Worker owns,
# which a deploy sets up on its own. The test copy doesn't get it (environments don't inherit it), so it counts nothing.
[[durable_objects.bindings]]
name = "PAGE_VIEWS"
class_name = "PageViews"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PageViews"]

# The Worker's logs (Workers Logs): every request it answers, how long it took, and anything it wrote with
# console.error, kept for 3 days on its page in the Cloudflare dashboard (Workers & Pages → ballkour-discord-widget →
# Observability). That's how to see what happened after ballkour.com was slow or down, since `npx wrangler tail` only
# shows requests while it's running. The free plan keeps up to 200,000 a day. Past that, the rest of the day's aren't
# kept, but the site carries on as usual.
[observability]
enabled = true

# On the hour and half past, the stats on players' Discord profiles catch up with the boards. At :15 and :45, players
# with runs but no number for their link get one (see "Players' own links" in worker.js, whose NUMBERS_CRON has to be
# the same as the second one here). At 00:00 UTC, the leaderboard bot's daily run starts (BOT_CRON in worker.js, the
# same as the third one here).
[triggers]
crons = ["*/30 * * * *", "15,45 * * * *", "0 0 * * *"]

# A test copy on workers.dev, with no route: npx wrangler deploy --env test
[env.test]
workers_dev = true
routes = []

# The test copy has no PROFILES (environments don't inherit it), so it has nothing to update
[env.test.triggers]
crons = []

# The test copy reads and saves the runs and the leaderboard history on the game repo's test-runs branch, never
# leaderboard-data, so the real boards aren't touched. Environments don't inherit [vars], so its reviewers are here too.
[env.test.vars]
REVIEWER_ROLES = "1497735437979226194" # mod
DATA_BRANCH = "test-runs"
